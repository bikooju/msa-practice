services:
  board-db:
    image: mysql:8.0
    container_name: board-db
    environment:
      MYSQL_ROOT_PASSWORD: "0519"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: board_db
    ports:
      - "3307:3306"
    volumes:
      - ./db/board-db:/var/lib/mysql

  user-db:
    image: mysql:8.0
    container_name: user-db
    environment:
      MYSQL_ROOT_PASSWORD: "0519"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: user_db
    ports:
      - "3308:3306"
    volumes:
      - ./db/user-db:/var/lib/mysql

  point-db:
    image: mysql:8.0
    container_name: point-db
    environment:
      MYSQL_ROOT_PASSWORD: "0519"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: point_db
    ports:
      - "3309:3306"
    volumes:
      - ./db/point-db:/var/lib/mysql


  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092"

